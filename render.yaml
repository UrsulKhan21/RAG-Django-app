services:
  - type: web
    name: api-chat-bot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn rag_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 600
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: COOKIE_SECURE
        value: "True"
      - key: COOKIE_SAMESITE
        value: "None"
      - key: DATA_UPLOAD_MAX_MEMORY_SIZE
        value: "104857600"
      - key: FILE_UPLOAD_MAX_MEMORY_SIZE
        value: "104857600"
      - key: THROTTLE_CHAT_QUERY_RATE
        value: "120/minute"
      - key: THROTTLE_SOURCE_WRITE_RATE
        value: "100/hour"
      - key: LLM_MAX_TOKENS
        value: "768"
      - key: LLM_MAX_CONTEXT_CHARS
        value: "6500"
      - key: LLM_MAX_CONTEXT_CHARS_PER_CHUNK
        value: "1400"
      - key: LLM_MAX_HISTORY_CHARS
        value: "1200"
      - key: RAG_MAX_TOP_K
        value: "4"
