services:
  - type: web
    name: api-chat-bot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn rag_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 180
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: COOKIE_SECURE
        value: "True"
      - key: COOKIE_SAMESITE
        value: "Lax"
